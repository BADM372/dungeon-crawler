<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cube Crawler - mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.164.1/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <div class="title">CUBE CRAWLER <span>mockup</span></div>
  <div>Depth <b id="depth">1</b> &middot; Seed <b id="seed">-</b> &middot; Layer <b id="layer">-</b></div>
  <div class="hp"><div id="hpbar"></div></div>
  <div id="status"></div>
  <div id="stats"></div>
</div>
<div id="help">
  <kbd>WASD</kbd> move &nbsp; <kbd>Q</kbd>/<kbd>E</kbd> rotate view &nbsp; <kbd>wheel</kbd> zoom &nbsp;
  <kbd>R</kbd> respawn &nbsp; <kbd>N</kbd> new cube &nbsp; <kbd>P</kbd> show generator path
</div>
<div id="legend">
  <div>entry <i style="background:#5fd3ff"></i></div>
  <div>exit portal <i style="background:#ffc94a"></i></div>
  <div>water (swim, slow) <i style="background:#2e86de"></i></div>
  <div>lava (deadly) <i style="background:#ff5a00"></i></div>
  <div>acid (burns) <i style="background:#7dff3a"></i></div>
  <div>stairs <i style="background:#c9bfae"></i></div>
  <div>bridge / fence <i style="background:#a0703f"></i></div>
</div>
<div id="flash"></div>
<div id="fade"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
